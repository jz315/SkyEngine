[package]
name = "sky-showcase-check"
version = "0.0.0"
edition = "2021"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[dependencies]
sky_engine = { path = "../..", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.34", optional = true }
glam = "0.32.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29"
yakui = { path = "../../crates/vendor/yakui/crates/yakui", optional = true }

[features]
default = []
app = ["sky_engine/app"]
physics = ["app", "sky_engine/physics"]
ui-legacy = ["app", "sky_engine/ui-legacy"]
ui-serein = ["app", "sky_engine/ui-serein"]
yakui-ui = ["app", "dep:yakui", "sky_engine/yakui-ui"]
egui = ["app", "dep:egui", "sky_engine/egui"]
live2d = ["app", "sky_engine/live2d"]
live2d-egui = ["live2d", "egui"]
kajiya-renderer = ["app", "sky_engine/kajiya-renderer"]
renderling-renderer = ["app", "sky_engine/renderling-renderer"]
vn-ui = ["ui-serein", "sky_engine/vn-ui"]

[[bin]]
name = "boids-classic"
path = "../../examples/demo/boids_classic.rs"
required-features = ["app"]

[[bin]]
name = "boids"
path = "../../examples/demo/boids.rs"
