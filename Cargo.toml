[package]
name = "sky_engine"
version = "0.1.0"
edition = "2021"
description = "High-performance ECS with chunk-based columnar storage"
license = "MIT"
keywords = ["ecs", "game-engine", "performance", "data-oriented"]
categories = ["game-engines", "data-structures"]
autobenches = false

[dependencies]
smallvec = "1.13.2"
lazy_static = "1.4.0"
mimalloc = "0.1.48"
rustc-hash = "2.1.2"
bitflags = "2"
serde = { version = "1", features = ["derive"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
mint = { version = "0.5", optional = true }

# GPU abstraction (feature-gated)
bytemuck = { version = "1", features = ["derive"], optional = true }

# wgpu backend (feature-gated)
wgpu = { version = "24", optional = true }

# Application framework (feature-gated)
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }

# Asset loading (feature-gated)
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde_json = { version = "1", optional = true }
cubism-sys = { package = "live2d-cubism-core-sys", version = "0.1", optional = true }
kira = { version = "0.12", optional = true }

# egui immediate-mode UI (feature-gated)
egui = { version = "0.31", optional = true }
egui-wgpu = { version = "0.31", optional = true }
egui-winit = { version = "0.31", optional = true }

# Existing optionals
minifb = { version = "0.28.0", optional = true }
rand = { version = "0.8", optional = true }
hecs = { version = "0.10.5", optional = true }
bevy_ecs = { version = "0.18.1", optional = true }
bevy = { version = "0.18.1", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_gizmos", "bevy_text", "bevy_post_process", "default_font", "png", "x11"], optional = true }

# ── ECS tutorials (no GPU needed) ─────────────────────────────────────────────

[[example]]
name = "hello_ecs"
path = "examples/ecs/hello_ecs.rs"

[[example]]
name = "queries"
path = "examples/ecs/queries.rs"

[[example]]
name = "commands"
path = "examples/ecs/commands.rs"

[[example]]
name = "systems"
path = "examples/ecs/systems.rs"

[[example]]
name = "tiny_defense"
path = "examples/ecs/tiny_defense.rs"

# ── Render API showcases (GPU, --features app) ───────────────────────────────

[[example]]
name = "clear_screen"
path = "examples/render/clear_screen.rs"
required-features = ["app"]

[[example]]
name = "sprite_demo"
path = "examples/render/sprite_demo.rs"
required-features = ["app"]

[[example]]
name = "textured_demo"
path = "examples/render/textured_demo.rs"
required-features = ["app"]

[[example]]
name = "perf_test"
path = "examples/render/perf_test.rs"
required-features = ["app"]

[[example]]
name = "lighting_demo"
path = "examples/render/lighting_demo.rs"
required-features = ["app"]

[[example]]
name = "render_graph_showcase"
path = "examples/render/render_graph_showcase.rs"
required-features = ["app"]

[[example]]
name = "renderer_probe"
path = "examples/render/renderer_probe.rs"
required-features = ["app"]

# ── Full demo showcases (GPU, --features app) ────────────────────────────────

[[example]]
name = "boids"
path = "examples/demo/boids.rs"
required-features = ["app"]

[[example]]
name = "boids_classic"
path = "examples/demo/boids_classic.rs"
required-features = ["app"]

[[example]]
name = "cosmic_jellyfish"
path = "examples/demo/cosmic_jellyfish.rs"
required-features = ["app"]

[[example]]
name = "neon_galaxy"
path = "examples/demo/neon_galaxy.rs"
required-features = ["app"]

# ── Live2D (--features live2d) ───────────────────────────────────────────────

[[example]]
name = "live2d_demo"
path = "examples/live2d/live2d_demo.rs"
required-features = ["live2d", "egui"]

[[example]]
name = "egui_demo"
path = "examples/render/egui_demo.rs"
required-features = ["egui"]

[[example]]
name = "asset_cook_smoke"
path = "examples/asset_cook_smoke.rs"
required-features = ["asset"]

[[example]]
name = "audio_demo"
path = "examples/audio_demo.rs"
required-features = ["app", "audio"]

# ── Legacy CPU-rendered (minifb, --features demo-legacy) ─────────────────────

[[example]]
name = "particles"
path = "examples/legacy/particles.rs"
required-features = ["demo-legacy"]

[[example]]
name = "asteroids"
path = "examples/legacy/asteroids.rs"
required-features = ["demo-legacy"]

[[example]]
name = "snake"
path = "examples/legacy/snake.rs"
required-features = ["demo-legacy"]

# ── Cross-engine comparisons (--features compare) ───────────────────────────

[[example]]
name = "boids_hecs"
path = "examples/compare/boids_hecs.rs"
required-features = ["compare"]

[[example]]
name = "boids_bevy"
path = "examples/compare/boids_bevy.rs"
required-features = ["compare"]

[[example]]
name = "boids_bevy_gpu"
path = "examples/compare/boids_bevy_gpu.rs"
required-features = ["compare-bevy"]

[features]
# Application framework (window + GPU + input)
app = ["dep:wgpu", "dep:winit", "dep:pollster", "dep:bytemuck"]
# Asset loading
asset = ["dep:image", "dep:serde", "dep:serde_json", "dep:uuid"]
# Audio runtime
audio = ["asset", "dep:kira", "dep:mint"]
# GPU-accelerated demos (future)
demo = ["app", "asset", "dep:rand"]
# Live2D Cubism SDK integration
live2d = ["app", "asset", "dep:cubism-sys", "dep:serde_json"]
# egui immediate-mode UI overlay
egui = ["app", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
# Legacy CPU-rendered demos (existing minifb demos)
demo-legacy = ["dep:minifb", "dep:rand"]
# Comparison benchmarks
compare = ["demo-legacy", "dep:hecs", "dep:bevy_ecs"]
# Full Bevy GPU comparison
compare-bevy = ["dep:bevy"]
[dev-dependencies]
criterion = "0.8.2"
cgmath = "0.18"
hecs = "0.10.5"
bevy_ecs = "0.18.1"
flecs_ecs = "0.2.2"
tempfile = "3"

[[bench]]
name = "fair"
path = "benches/fair/main.rs"
harness = false

[profile.release]
debug = true

[patch.crates-io]
live2d-cubism-core-sys = { path = "cubism-sys" }

[[bin]]
name = "sky-cook"
path = "src/bin/sky-cook.rs"
required-features = ["asset"]
