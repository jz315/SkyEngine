[package]
name = "sky_engine"
version = "0.1.0"
edition = "2021"
description = "High-performance ECS with chunk-based columnar storage"
license = "MIT"
keywords = ["ecs", "game-engine", "performance", "data-oriented"]
categories = ["game-engines", "data-structures"]
autobenches = false

[dependencies]
smallvec = "1.13.2"
lazy_static = "1.4.0"
mimalloc = "0.1.48"
rustc-hash = "2.1.2"
sky_type = { path = "crates/sky_type" }
sky_ecs = { path = "crates/sky_ecs" }
bitflags = "2"
rayon = "1.10"
glam = "0.32.1"
log = { version = "0.4", features = ["std"] }
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
yarnspinner = { version = "0.8", default-features = false, optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
mint = { version = "0.5", optional = true }

# GPU abstraction (feature-gated)
bytemuck = { version = "1", features = ["derive"], optional = true }
bytes = { version = "1", optional = true }

# wgpu backend (feature-gated)
wgpu = { version = "29", optional = true }
gltf = { version = "1", optional = true }

# Application framework (feature-gated)
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
webbrowser = { version = "1.2.1", optional = true }
exr = { version = "1.74", optional = true }
half = { version = "2.7", features = ["bytemuck"], optional = true }
intel-tex-2 = { package = "intel_tex_2", version = "=0.2.2", optional = true }
kajiya = { path = "crates/vendor/kajiya/crates/lib/kajiya", optional = true }
kajiya-rust-shaders-shared = { package = "rust-shaders-shared", path = "crates/vendor/kajiya/crates/lib/rust-shaders-shared", optional = true }
renderling = { version = "0.4.9", default-features = false, features = ["shaders"], optional = true }
gpu-profiler = { path = "crates/vendor/gpu-profiler", optional = true }
puffin = { version = "0.20", optional = true }
raw-window-handle-03 = { package = "raw-window-handle", version = "0.3", optional = true }
shader-prepper = { version = "=0.3.0-pre.3", optional = true }
turbosloth = { git = "https://github.com/h3r2tic/turbosloth.git", rev = "92030af", optional = true }

# Asset loading (feature-gated)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"], optional = true }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
roxmltree = { version = "0.20", optional = true }
base64 = { version = "0.13", optional = true }
flate2 = { version = "1", optional = true }
cubism-sys = { package = "live2d-cubism-core-sys", version = "0.1", path = "crates/cubism-sys", optional = true }
kira = { version = "0.12", optional = true }
rapier2d = { version = "0.32.0", optional = true }
ffmpeg-next = { version = "8.1.0", optional = true }
sky_engine_reflect_derive = { path = "crates/sky_engine_reflect_derive" }

# egui immediate-mode UI (feature-gated)
egui = { version = "0.34", optional = true }
egui-wgpu = { version = "0.34", optional = true }
egui-winit = { version = "0.34", optional = true }
glyphon = { version = "0.11", optional = true }
eui-neo = { path = "crates/eui-neo", optional = true }
eui-neo-wgpu = { path = "crates/eui-neo-wgpu", optional = true }
eui-neo-winit = { path = "crates/eui-neo-winit", optional = true }
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }
yakui = { path = "crates/vendor/yakui/crates/yakui", optional = true, default-features = true }
yakui-core = { path = "crates/vendor/yakui/crates/yakui-core", optional = true }
yakui-widgets = { path = "crates/vendor/yakui/crates/yakui-widgets", optional = true, default-features = true }
yakui-wgpu = { path = "crates/vendor/yakui/crates/yakui-wgpu", optional = true }
yakui-winit = { path = "crates/vendor/yakui/crates/yakui-winit", optional = true }

# Existing optionals
minifb = { version = "0.28.0", optional = true }
rand = { version = "0.8", optional = true }
hecs = { version = "0.10.5", optional = true }
bevy_ecs = { version = "0.18.1", optional = true }
bevy = { version = "0.18.1", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_gizmos", "bevy_text", "bevy_post_process", "default_font", "png", "x11"], optional = true }

