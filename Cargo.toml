[features]
# Cross-platform OS helpers.
platform = ["dep:webbrowser"]
# Application framework (window + GPU + input + assets)
app = ["asset", "platform", "sky_math/wgpu", "dep:wgpu", "dep:winit", "dep:pollster", "dep:bytemuck", "dep:gltf"]
# Optional Renderer2D stage timing instrumentation.
render-timings = []
# Structured engine profiling. Disabled unless `SKY_PROFILE=1` at runtime.
profile = [
    "dep:sky_profile",
    "sky_ecs/profile",
    "render-timings",
    "eui-neo?/profile",
    "eui-neo-wgpu?/profile",
]
profile-tracy = ["profile", "sky_profile/tracy"]
profile-gpu = ["profile", "app"]
# Experimental Kajiya Vulkan renderer backend.
kajiya-renderer = [
    "dep:kajiya",
    "dep:kajiya-rust-shaders-shared",
    "dep:gpu-profiler",
    "dep:bytes",
    "dep:raw-window-handle-03",
    "dep:turbosloth",
]
# Experimental Renderling wgpu renderer backend.
renderling-renderer = ["dep:renderling"]
# Asset loading
asset = [
    "dep:image",
    "dep:serde",
    "dep:serde_json",
    "dep:uuid",
    "dep:roxmltree",
    "dep:base64",
    "dep:flate2",
]
# Optional native file watching for asset hot reload. Enable alongside `app` or
# `asset` when editor/dev builds should react to filesystem events instead of
# relying only on periodic polling.
asset-watch = ["asset", "dep:notify"]
# Audio runtime
audio = ["asset", "dep:kira", "dep:mint"]
# Video runtime with playback clocks, frame queues, and stable streamed-frame buffers.
video = ["app"]
# Native video decoding backend. Requires system FFmpeg development libraries.
video-ffmpeg = ["video", "dep:ffmpeg-next"]
# Scene and prefab documents/spawning.
scene = ["dep:serde", "dep:serde_json", "dep:inventory", "dep:uuid"]
# Serde support for reflected values.
reflect-serde = ["sky_reflect/serde"]
# 2D physics runtime backed by Rapier.
physics = ["dep:rapier2d"]
# Visual novel / Galgame script and runtime core.
vn = ["dep:serde", "dep:toml", "dep:yarnspinner"]
vn-ui = ["vn", "ui-neo"]
vn-audio = ["vn", "audio"]
vn-live2d = ["vn", "live2d"]
vn-tools = ["vn"]
# GPU-accelerated demos (future)
demo = ["app", "asset"]
# Live2D Cubism SDK integration
live2d = ["app", "asset", "dep:cubism-sys", "dep:serde_json"]
# egui immediate-mode UI overlay
egui = ["app", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
# Backend-neutral UI host.
ui-core = ["app"]
# Legacy retained-mode game UI overlay
ui-legacy = ["ui-core", "dep:glyphon"]
# Experimental EUI-NEO-inspired declarative game UI runtime.
ui-neo = [
    "ui-core",
    "dep:eui-neo",
    "dep:eui-neo-wgpu",
    "dep:eui-neo-winit",
]
# Optional network image/text helpers for EUI-NEO examples and remote images.
ui-neo-net = [
    "ui-neo",
    "dep:ureq",
]
# Experimental yakui retained/declarative game UI backend.
yakui-ui = [
    "ui-core",
    "dep:yakui",
    "dep:yakui-core",
    "dep:yakui-wgpu",
    "dep:yakui-winit",
]
[dev-dependencies]
criterion = "0.8.2"
tempfile = "3"

[[bench]]
name = "parallel_query"
path = "benches/parallel_query.rs"
harness = false

[[bench]]
name = "sky_math"
path = "benches/sky_math.rs"
harness = false

[[bench]]
name = "neo_ui"
path = "benches/neo_ui.rs"
harness = false
required-features = ["ui-neo"]

[profile.release]
debug = true

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[patch.crates-io]
# Kajiya's shader reflection path relies on the ray-tracing extensions from this
# rspirv branch. Keep this patch scoped to builds that pull Kajiya in.
rspirv = { git = "https://github.com/gfx-rs/rspirv.git", rev = "dae552c" }
spirv_headers = { git = "https://github.com/gfx-rs/rspirv.git", rev = "dae552c" }

[patch."https://github.com/h3r2tic/gpu-profiler.git"]
gpu-profiler = { path = "crates/vendor/gpu-profiler" }

[[bin]]
name = "sky-cook"
path = "src/bin/sky-cook.rs"
required-features = ["asset"]
