[package]
name = "sky_engine"
version = "0.1.0"
edition = "2021"
description = "High-performance ECS with chunk-based columnar storage"
license = "MIT"
keywords = ["ecs", "game-engine", "performance", "data-oriented"]
categories = ["game-engines", "data-structures"]
autobenches = false

[dependencies]
smallvec = "1.13.2"
lazy_static = "1.4.0"
minifb = { version = "0.28.0", optional = true }
rand = { version = "0.8", optional = true }

[[example]]
name = "particles"
required-features = ["demo"]

[features]
demo = ["minifb", "rand"]
[dev-dependencies]
criterion = "0.4"
cgmath = "0.18"
hecs = "0.10.5"
bevy_ecs = "0.18.1"

[[bench]]
name = "sky"
path = "benches/sky/main.rs"
harness = false

[[bench]]
name = "hecs"
path = "benches/hecs/main.rs"
harness = false

[[bench]]
name = "bevy"
path = "benches/bevy/main.rs"
harness = false

[[bench]]
name = "fair"
path = "benches/fair/main.rs"
harness = false

[profile.release]
debug = true
