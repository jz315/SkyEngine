[package]
name = "sky_profile"
version = "0.1.0"
edition = "2021"
description = "Structured profiling facade for SkyEngine"
license = "MIT"

[features]
default = []
tracy = ["dep:profiling", "profiling/profile-with-tracy"]

[dependencies]
profiling = { version = "1.0.17", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
