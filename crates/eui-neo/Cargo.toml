[package]
name = "eui-neo"
version = "0.1.0"
edition = "2021"
description = "Rust-native EUI-NEO port and extension with a headless declarative UI runtime"
readme = "README.md"
license = "MIT"
keywords = ["ui", "game-ui", "declarative", "eui-neo"]
categories = ["gui", "game-development"]

[dependencies]
bitflags = "2"
cosmic-text = "0.18"
profiling = { version = "1.0.17", default-features = false, optional = true }
rustc-hash = "2.1.2"
smallvec = "1.13.2"

[features]
default = []
profile = ["dep:profiling"]
